services:
  storage:
    image: docker.io/rustfs/rustfs@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff # 1.0.0
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: gatekeeper-test
      RUSTFS_SECRET_KEY: gatekeeper-local-only
      RUSTFS_CONSOLE_ENABLE: "false"
    ports:
      - "127.0.0.1:19000:9000"
  catalog:
    image: apache/iceberg-rest-fixture@sha256:db8de90b5b7693d4ac334c336f91d9bbe320d7b19f4f514d26de84cdfbcbfe8d
    environment:
      AWS_ACCESS_KEY_ID: gatekeeper-test
      AWS_SECRET_ACCESS_KEY: gatekeeper-local-only
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://storage:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    ports:
      - "127.0.0.1:18181:8181"
    depends_on:
      - storage
