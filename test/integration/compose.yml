services:
  storage:
    image: quay.io/minio/minio@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    command: server /data
    environment:
      MINIO_ROOT_USER: gatekeeper-test
      MINIO_ROOT_PASSWORD: gatekeeper-local-only
    ports:
      - "127.0.0.1:19000:9000"
  catalog:
    image: apache/iceberg-rest-fixture@sha256:db8de90b5b7693d4ac334c336f91d9bbe320d7b19f4f514d26de84cdfbcbfe8d
    environment:
      AWS_ACCESS_KEY_ID: gatekeeper-test
      AWS_SECRET_ACCESS_KEY: gatekeeper-local-only
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://storage:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    ports:
      - "127.0.0.1:18181:8181"
    depends_on:
      - storage
