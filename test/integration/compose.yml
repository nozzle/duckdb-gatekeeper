services:
  storage:
    image: docker.io/rustfs/rustfs@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a # 1.0.6
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: gatekeeper-test
      RUSTFS_SECRET_KEY: gatekeeper-local-only
      RUSTFS_CONSOLE_ENABLE: "false"
    ports:
      - "127.0.0.1:19000:9000"
  catalog:
    image: apache/iceberg-rest-fixture@sha256:009f9f6897cc1e8fd6e8133c401c7a3e7c333c71293a621d06a71570ae989c29
    environment:
      AWS_ACCESS_KEY_ID: gatekeeper-test
      AWS_SECRET_ACCESS_KEY: gatekeeper-local-only
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://storage:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    ports:
      - "127.0.0.1:18181:8181"
    depends_on:
      - storage
