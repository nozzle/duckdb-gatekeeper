version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/test/integration"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore"
    ignore:
      # Engine upgrades must coordinate the submodule, build pins, inventories, and fuzz image.
      - dependency-name: "duckdb"
    groups:
      python:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
