version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    ignore:
      - dependency-name: "duckdb"
    groups:
      pip:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/test/integration"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      pip:
        patterns:
          - "*"
