version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/test/fuzz"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"

  # requirements*.in are the edited inputs; the hashed requirements*.txt lock files are
  # regenerated with uv pip compile --universal. Dependabot bumps pins and hashes in the
  # lock files directly; rerun the compile command when an .in file changes.
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/test/integration"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
    ignore:
      # Engine upgrades must coordinate the submodule, build pins, inventories, and fuzz image.
      - dependency-name: "duckdb"
    groups:
      python:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
