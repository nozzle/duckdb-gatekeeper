name: Candidate DuckDB inventory audit
on:
  workflow_dispatch:
    inputs:
      duckdb_version:
        description: Candidate Python DuckDB version (capture and compare only)
        required: true
permissions:
  contents: read
concurrency:
  group: inventory-audit-${{ github.ref }}-${{ inputs.duckdb_version }}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
        with:
          requirements: ''  # the candidate engine below replaces the pinned one
      - name: Install candidate
        env:
          VERSION: ${{ inputs.duckdb_version }}
        run: python -m pip install "duckdb==$VERSION"
      - run: python scripts/audit_inventory.py --capture build/candidate.json
      - run: python scripts/audit_inventory.py --candidate build/candidate.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: candidate-inventory
          path: build/candidate.json
