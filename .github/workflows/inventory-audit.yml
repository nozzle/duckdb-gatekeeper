name: Candidate DuckDB inventory audit
on:
  workflow_dispatch:
    inputs:
      duckdb_version:
        description: Candidate Python DuckDB version (capture and compare only)
        required: true
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install candidate
        env:
          VERSION: ${{ inputs.duckdb_version }}
        run: python -m pip install -r requirements-inventory.txt "duckdb==$VERSION"
      - run: python scripts/audit_inventory.py --capture build/candidate.json
      - run: python scripts/audit_inventory.py --candidate build/candidate.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: candidate-inventory
          path: build/candidate.json
