name: Linked SQL and typed-option fuzzing
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sql-fuzz-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
        with:
          ccache-key: sql-fuzz-ubuntu-latest
      - run: sudo apt-get update -qq && sudo apt-get install -y clang libclang-rt-dev
      - run: python scripts/fuzz_sql.py --seconds ${{ github.event_name == 'schedule' && 1800 || 120 }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sql-fuzz-evidence
          path: |
            build/sql-fuzz/fuzz.log
            build/sql-fuzz/crash-*
            build/sql-fuzz/timeout-*
