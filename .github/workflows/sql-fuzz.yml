name: Linked SQL and typed-option fuzzing
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y clang libclang-rt-dev
      - run: python scripts/fuzz_sql.py --seconds 120
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sql-fuzz-evidence
          path: |
            build/sql-fuzz/fuzz.log
            build/sql-fuzz/crash-*
            build/sql-fuzz/timeout-*
