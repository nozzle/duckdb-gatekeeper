name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # Honored by CMake for every configuration in this repository, including the helper scripts.
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
jobs:
  test:
    name: Test (${{ matrix.os }})
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: release-${{ matrix.os }}
          max-size: 600M
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: cmake -G Ninja -S duckdb -B build/release -DPython3_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')" -DCMAKE_BUILD_TYPE=Release -DOVERRIDE_GIT_DESCRIBE=v1.5.5 -DDUCKDB_EXTENSION_CONFIGS=${{ github.workspace }}/extension_config.cmake -DBUILD_UNITTESTS=OFF -DBUILD_SHELL=OFF
      - run: cmake --build build/release --target gatekeeper_loadable_extension --parallel
      - run: python -m pytest test -q
      - run: python scripts/audit_inventory.py
      - run: clang-format --dry-run --Werror src/*.cpp src/include/*.hpp test/fuzz/*.cpp
      - name: Local lakehouse integration
        if: runner.os == 'Linux'
        run: |
          python -m pip install --require-hashes -r test/integration/requirements.txt
          python -c "import duckdb; c=duckdb.connect(); c.execute('INSTALL iceberg; INSTALL ducklake; INSTALL httpfs')"
          python scripts/test_lakehouses.py
      - name: Native fuzz smoke test
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang libclang-rt-dev
          CXX=clang++ python scripts/fuzz_native.py --seconds 60

  sanitized:
    name: Sanitized test suite
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: sanitized-ubuntu-latest
          max-size: 600M
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y clang libclang-rt-dev
      # Clang is required here; see the module docstring in scripts/test_sanitized.py.
      - run: python scripts/test_sanitized.py
        env:
          CC: clang
          CXX: clang++

  extension-template:
    # The community build path: extension-ci-tools Makefile, static linking into the shell and
    # unittest binary, and the sqllogictests in test/sql.
    name: Makefile build and sqllogictests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: makefile-ubuntu-latest
          max-size: 1G
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: make release
        env:
          GEN: ninja
      - run: make test_release

  lock-windows:
    # The hashed locks are resolved universally; prove the Windows-only markers (colorama) and
    # win_amd64 wheel hashes install without a full Windows build.
    name: Hashed lock install (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes -r requirements-dev.txt -r test/integration/requirements.txt
      - run: python -c "import colorama, duckdb, pytest, jsonschema, boto3; print(duckdb.__version__)"
