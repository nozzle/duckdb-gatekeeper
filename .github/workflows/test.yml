name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: cmake -G Ninja -S duckdb -B build/release -DCMAKE_BUILD_TYPE=Release -DDUCKDB_EXTENSION_CONFIGS=${{ github.workspace }}/extension_config.cmake -DBUILD_UNITTESTS=OFF -DBUILD_SHELL=OFF
      - run: cmake --build build/release --target gatekeeper_loadable_extension --parallel 2
      - run: python -m pytest test -q
      - run: python scripts/audit_inventory.py
      - run: clang-format --dry-run --Werror src/*.cpp src/include/*.hpp
