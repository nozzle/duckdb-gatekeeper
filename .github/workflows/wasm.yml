name: Wasm browser tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wasm-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  eh:
    name: Wasm EH Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - run: python3 scripts/build_wasm.py
      - uses: ./.github/actions/wasm-browser-test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gatekeeper-wasm-eh-browser-tested
          path: build/wasm_eh/extension/gatekeeper/gatekeeper.duckdb_extension.wasm
          if-no-files-found: error
