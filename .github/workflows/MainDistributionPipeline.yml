name: Extension distribution
# Builds and tests Gatekeeper on every community-extension platform through the reusable
# extension-ci-tools pipeline (linux amd64/arm64 glibc and musl, macOS amd64/arm64,
# Windows MSVC x64/ARM64 and MinGW). This is the DuckDB community build path and our
# Windows/musl platform matrix. Wasm EH is browser-tested here and in wasm.yml; MVP and threads
# remain excluded (see test/wasm/README.md). Both refs below are pinned to the commit tracked by the
# extension-ci-tools submodule; upstream publishes 1.5.x tooling on the v1.5-variegata branch.
#
# Every shipped artifact is then loaded, as the loadable it is, into an official DuckDB host of the
# pinned version and exercised across the host/loadable ABI boundary: the Python package for the six
# targets it has wheels for (loadable-test), the musl CLI in Alpine for the two musl targets
# (loadable-cli), the CRAN R package for MinGW (loadable-r), and Chromium for Wasm EH (browser-test).
on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: distribution-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # The hosts of the loadable jobs that are not the pinned Python package. Both move with the engine pin
  # (inventories/README.md, "Repinning the engine"): the CLI is the engine's own release asset; the R
  # package is CRAN's build of the same engine, installed as a Windows binary from a dated Posit Package
  # Manager snapshot so the version stays what it was validated with (CRAN keeps only the current binary).
  # The snapshot must postdate the CRAN release of the duckdb package version equal to the engine pin.
  R_VERSION: '4.6.1'
  R_CRAN_SNAPSHOT: https://packagemanager.posit.co/cran/2026-09-01
  # The container the musl CLI runs in (multi-arch index digest; alpine:3.22). Reviewed with the other
  # container images in the periodic dependency pass, not engine-coupled.
  ALPINE_IMAGE: alpine@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
jobs:
  metadata:
    # The engine pin the reusable pipeline builds against and names its artifacts with, read from
    # versions.cmake so it cannot drift from the submodule, the Python package, and the Makefile.
    name: Release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      duckdb_version: ${{ steps.versions.outputs.duckdb_version }}
      duckdb_revision: ${{ steps.versions.outputs.duckdb_revision }}
      extension_version: ${{ steps.versions.outputs.extension_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: versions
        run: python3 scripts/versions.py | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build extension binaries
    needs: metadata
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@72e76e99cd7fee45a99739cd118ec2db64e034ec # v1.5-variegata
    with:
      extension_name: gatekeeper
      duckdb_version: v${{ needs.metadata.outputs.duckdb_version }}
      ci_tools_version: 72e76e99cd7fee45a99739cd118ec2db64e034ec
      # scripts/generate.py runs at configure time; the musl images only ship Python on request.
      extra_toolchains: python3
      # Both musl targets and Windows ARM64 are opt-in at this revision.
      opt_in_archs: 'linux_amd64_musl;linux_arm64_musl;windows_arm64'
      exclude_archs: 'wasm_mvp;wasm_threads'
      reduced_ci_mode: disabled

  browser-test:
    name: Distribution Wasm EH Chromium
    needs: [metadata, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gatekeeper-v${{ needs.metadata.outputs.duckdb_version }}-extension-wasm_eh
          path: build/wasm_eh/extension/gatekeeper
      - uses: ./.github/actions/wasm-browser-test

  loadable-test:
    # The reusable pipeline tests a statically linked unittest binary, and skips even that for
    # linux_arm64 and the cross-compiled osx_amd64. These jobs load the actual distributed artifacts
    # into the pinned DuckDB Python package, so the host/loadable ABI boundary (bind-data inspection,
    # replacement-scan callbacks, the policy setting, the query hooks enforcement lives in, the log
    # manager) is exercised on the six targets below, the ones a pinned Python wheel can load, each
    # with scripts/smoke_loadable.py and the full Python suite. The musl and MinGW artifacts have
    # their own hosts below.
    name: Distributed loadable (${{ matrix.arch }})
    needs: [metadata, build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: linux_amd64 }
          - { os: ubuntu-24.04-arm, arch: linux_arm64 }
          - { os: macos-latest, arch: osx_arm64 }
          - { os: macos-15-intel, arch: osx_amd64 }
          - { os: windows-latest, arch: windows_amd64 }
          - { os: windows-11-arm, arch: windows_arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gatekeeper-v${{ needs.metadata.outputs.duckdb_version }}-extension-${{ matrix.arch }}
          path: build/distributed
      - name: Stamped engine identity matches the pinned engine
        run: python scripts/check_engine_stamp.py --extension build/distributed/gatekeeper.duckdb_extension --expect-version v${{ needs.metadata.outputs.duckdb_version }}
      - name: ABI-sensitive smoke checks against the distributed artifact
        run: python scripts/smoke_loadable.py build/distributed/gatekeeper.duckdb_extension
      - name: Full pytest suite against the distributed artifact
        env:
          GATEKEEPER_EXTENSION: ${{ github.workspace }}/build/distributed/gatekeeper.duckdb_extension
        # The C++-compiling tests need the build tree; everything else loads GATEKEEPER_EXTENSION.
        run: python -m pytest test -q --ignore test/test_engine_errors.py --ignore test/test_validator_structure.py --ignore test/test_inventory_tooling.py

  loadable-cli:
    # The musl artifacts: no Python wheel exists, so the host is the engine's own musl CLI (dynamically
    # linked against musl, so it can dlopen the extension) inside Alpine. scripts/smoke_cli.sh runs the
    # portable SQL smoke on it and replays the enforced checks as separate CLI processes.
    name: Distributed loadable (${{ matrix.arch }})
    needs: [metadata, build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: linux_amd64_musl, cli: amd64 }
          - { os: ubuntu-24.04-arm, arch: linux_arm64_musl, cli: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gatekeeper-v${{ needs.metadata.outputs.duckdb_version }}-extension-${{ matrix.arch }}
          path: build/distributed
      - name: Stamped engine identity matches the pinned engine
        # Standard library only; no Python toolchain is installed in this job.
        run: python3 scripts/check_engine_stamp.py --extension build/distributed/gatekeeper.duckdb_extension --expect-version v${{ needs.metadata.outputs.duckdb_version }}
      - name: Fetch the engine's musl CLI release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v${{ needs.metadata.outputs.duckdb_version }}" --repo duckdb/duckdb \
            --pattern "duckdb_cli-linux-${{ matrix.cli }}-musl.zip" --dir build/cli
          unzip -q build/cli/duckdb_cli-linux-${{ matrix.cli }}-musl.zip -d build/cli
      - name: CLI smoke checks against the distributed artifact, in Alpine
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$ALPINE_IMAGE" sh -c \
            'apk add --no-cache libstdc++ >/dev/null && sh scripts/smoke_cli.sh build/cli/duckdb build/distributed/gatekeeper.duckdb_extension v${{ needs.metadata.outputs.duckdb_version }} ${{ matrix.arch }}'

  loadable-r:
    # The MinGW artifact exists for DuckDB's R package, which RTools builds with MinGW; no other official
    # host loads it. scripts/smoke_loadable.R runs the portable SQL smoke through DBI, with two connections
    # for the enforced half. R's dbExecute prepares before executing, so this is also the only leg that
    # takes the client Prepare() path on the shipped binary.
    name: Distributed loadable (windows_amd64_mingw)
    needs: [metadata, build]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gatekeeper-v${{ needs.metadata.outputs.duckdb_version }}-extension-windows_amd64_mingw
          path: build/distributed
      - name: Stamped engine identity matches the pinned engine
        run: python scripts/check_engine_stamp.py --extension build/distributed/gatekeeper.duckdb_extension --expect-version v${{ needs.metadata.outputs.duckdb_version }}
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: ${{ env.R_VERSION }}
          rtools-version: none
          use-public-rspm: false
      - name: Install the CRAN duckdb package (Windows binary from the pinned snapshot)
        shell: bash
        run: Rscript -e 'install.packages(c("DBI", "duckdb"), repos = Sys.getenv("R_CRAN_SNAPSHOT"), quiet = TRUE); cat("duckdb", as.character(packageVersion("duckdb")), "\n")'
      - name: R smoke checks against the distributed artifact
        shell: bash
        run: Rscript scripts/smoke_loadable.R build/distributed/gatekeeper.duckdb_extension v${{ needs.metadata.outputs.duckdb_version }} windows_amd64_mingw

  package:
    name: Package unsigned release artifacts
    needs: [build, browser-test, loadable-test, loadable-cli, loadable-r]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gatekeeper-*-extension-*
          path: build/release-artifacts
      - name: Package and checksum every target
        env:
          # Exercise packaging on PRs/main too; version tags must match the source.
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: python3 scripts/package_release.py --tag "$RELEASE_TAG" --artifacts build/release-artifacts --output build/release-assets
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gatekeeper-release-assets
          path: build/release-assets
          if-no-files-found: error

  release:
    name: Publish unsigned release artifacts
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gatekeeper-release-assets
          path: build/release-assets
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        # Assemble as a draft so failed uploads cannot publish a partial release.
        run: |
          existing=$(gh api --paginate "repos/$GH_REPO/releases" \
            | jq -r --arg tag "$RELEASE_TAG" '.[] | select(.tag_name == $tag) | .id')
          if [[ -n "$existing" ]]; then
            echo "::error::A release or draft for $RELEASE_TAG already exists; inspect it before retrying."
            exit 1
          fi
          gh release create "$RELEASE_TAG" build/release-assets/*.zip build/release-assets/SHA256SUMS \
            --verify-tag --draft --title "Gatekeeper $RELEASE_TAG" \
            --notes-file build/release-assets/RELEASE_NOTES.md
          gh release edit "$RELEASE_TAG" --draft=false
