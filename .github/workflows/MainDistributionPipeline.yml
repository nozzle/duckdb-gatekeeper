name: Extension distribution
# Builds and tests Gatekeeper on every community-extension platform through the reusable
# extension-ci-tools pipeline (linux amd64/arm64 glibc and musl, macOS amd64/arm64,
# Windows MSVC x64/ARM64 and MinGW). This is the DuckDB community build path and our
# Windows/musl platform matrix. Wasm EH is browser-tested here and in wasm.yml; MVP and threads
# remain excluded (see test/wasm/README.md). Both refs below are pinned to the commit tracked by the
# extension-ci-tools submodule; upstream publishes 1.5.x tooling on the v1.5-variegata branch.
on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: distribution-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@72e76e99cd7fee45a99739cd118ec2db64e034ec # v1.5-variegata
    with:
      extension_name: gatekeeper
      duckdb_version: v1.5.5
      ci_tools_version: 72e76e99cd7fee45a99739cd118ec2db64e034ec
      # scripts/generate.py runs at configure time; the musl images only ship Python on request.
      extra_toolchains: python3
      # Both musl targets and Windows ARM64 are opt-in at this revision.
      opt_in_archs: 'linux_amd64_musl;linux_arm64_musl;windows_arm64'
      exclude_archs: 'wasm_mvp;wasm_threads'
      reduced_ci_mode: disabled

  browser-test:
    name: Distribution Wasm EH Chromium
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: test/wasm/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gatekeeper-v1.5.5-extension-wasm_eh
          path: build/wasm_eh/extension/gatekeeper
      - run: npm ci --ignore-scripts
        working-directory: test/wasm
      - run: npx playwright install --with-deps chromium
        working-directory: test/wasm
      - run: npm test
        working-directory: test/wasm

  loadable-test:
    # The reusable pipeline tests a statically linked unittest binary. These jobs load the actual
    # distributed artifacts into the pinned DuckDB Python package, so the host/loadable ABI boundary
    # (bind-data inspection, replacement-scan callbacks, the policy setting) is exercised on every
    # desktop platform, including the ones where pytest otherwise never runs.
    name: Distributed loadable (${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: linux_amd64, pytest: true }
          - { os: ubuntu-24.04-arm, arch: linux_arm64, pytest: true }
          - { os: macos-latest, arch: osx_arm64, pytest: true }
          - { os: macos-15-intel, arch: osx_amd64, pytest: false }
          - { os: windows-latest, arch: windows_amd64, pytest: false }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gatekeeper-v1.5.5-extension-${{ matrix.arch }}
          path: build/distributed
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Stamped engine identity matches the pinned engine
        run: python scripts/check_engine_stamp.py --extension build/distributed/gatekeeper.duckdb_extension --expect-version v1.5.5
      - name: ABI-sensitive smoke checks against the distributed artifact
        run: python scripts/smoke_loadable.py build/distributed/gatekeeper.duckdb_extension
      - name: Full pytest suite against the distributed artifact
        if: matrix.pytest
        env:
          GATEKEEPER_EXTENSION: ${{ github.workspace }}/build/distributed/gatekeeper.duckdb_extension
        # The C++-compiling tests need the build tree; everything else loads GATEKEEPER_EXTENSION.
        run: python -m pytest test -q --ignore test/test_engine_errors.py --ignore test/test_validator_structure.py --ignore test/test_inventory_tooling.py

  package:
    name: Package unsigned release artifacts
    needs: [build, browser-test, loadable-test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gatekeeper-*-extension-*
          path: build/release-artifacts
      - name: Package and checksum every target
        env:
          # Exercise packaging on PRs/main too; version tags must match the source.
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: python3 scripts/package_release.py --tag "$RELEASE_TAG" --artifacts build/release-artifacts --output build/release-assets
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gatekeeper-release-assets
          path: build/release-assets
          if-no-files-found: error

  release:
    name: Publish unsigned release artifacts
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gatekeeper-release-assets
          path: build/release-assets
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        # Assemble as a draft so failed uploads cannot publish a partial release.
        run: |
          existing=$(gh api --paginate "repos/$GH_REPO/releases" \
            | jq -r --arg tag "$RELEASE_TAG" '.[] | select(.tag_name == $tag) | .id')
          if [[ -n "$existing" ]]; then
            echo "::error::A release or draft for $RELEASE_TAG already exists; inspect it before retrying."
            exit 1
          fi
          gh release create "$RELEASE_TAG" build/release-assets/*.zip build/release-assets/SHA256SUMS \
            --verify-tag --draft --title "Gatekeeper $RELEASE_TAG" \
            --notes-file build/release-assets/RELEASE_NOTES.md
          gh release edit "$RELEASE_TAG" --draft=false
