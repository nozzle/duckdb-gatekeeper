name: Engine rebuild compatibility
# Builds each full candidate engine (~1h), so run on main, on demand, and only for PRs that touch
# the build or engine-facing sources rather than every documentation change. Candidates: a
# post-release snapshot of the pinned release line; the DuckDB 2.0 prerelease duckdb/community-extensions
# builds and deploys a descriptor's `repo.ref` for until 2.0.0 ships; and a newer `v2.0-cyanoptera`
# snapshot, the line 2.0.0 ships from. All pins are moved by hand (AGENTS.md); a build that breaks
# against a new snapshot is the signal, not noise.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/actions/**
      - .github/workflows/compatibility.yml
      - CMakeLists.txt
      - Makefile
      - extension_config.cmake
      - versions.cmake
      - duckdb
      - extension-ci-tools
      - requirements-dev.txt
      - inventories/**
      - scripts/**
      - src/**
      - test/sql/**
      - test/native/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  candidate:
    name: Rebuild against ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Retained pre-1.5.6 snapshot: prove compatibility with the earlier release-line API.
          - name: DuckDB 1.5 candidate (a3cd0de)
            key: a3cd0de
            ref: a3cd0deed18489bafdbdadb02f4e8b36c5e8a653
            engine_major: '1'
          # v2.0-cyanoptera at DuckDB's Main run 44357, deployed as v2.0.0-alpha44357: the engine the community
          # repository builds a descriptor's repo.ref against until 2.0.0 ships. Labels itself v2.0.0-devN here.
          - name: DuckDB 2.0 alpha44357 (db0ecec)
            key: db0ecec
            ref: db0ecec124f697710036513a29e9f93a0f8577d0
            nested_schemas: '1'
            engine_major: '2'
          # A newer v2.0-cyanoptera snapshot, the line 2.0.0 ships from; labels itself v2.0.0-devN.
          - name: DuckDB 2.0 candidate (45dc0a0)
            key: 45dc0a0
            ref: 45dc0a0958c37d4f491604a76e4dd472b404d1de
            nested_schemas: '1'
            engine_major: '2'
    env:
      CANDIDATE_ENGINE: ${{ matrix.ref }}
      GATEKEEPER_TEST_NESTED_SCHEMAS: ${{ matrix.nested_schemas || '0' }}
      GATEKEEPER_TEST_ENGINE_MAJOR: ${{ matrix.engine_major }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Check out the candidate engine
        # Fetched by commit with full history and tags, which is what labels the build (`git describe` on
        # 1.5, `git rev-list --count` on 2.0). Fetched by git, as the community job below does, rather than
        # through actions/checkout: code scanning cannot see that a matrix ref is a literal SHA.
        run: |
          git init --quiet build/candidate-source
          git -C build/candidate-source remote add origin https://github.com/duckdb/duckdb.git
          git -C build/candidate-source fetch --quiet --tags origin "$CANDIDATE_ENGINE"
          git -C build/candidate-source checkout --quiet "$CANDIDATE_ENGINE"
          git -C build/candidate-source log -1 --oneline
      - uses: ./.github/actions/setup
        with:
          ccache-key: candidate-${{ matrix.key }}-ubuntu
          ccache-max-size: 1G
      - name: Configure against the actual candidate source
        run: >-
          cmake -G Ninja -S build/candidate-source -B build/candidate
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DDUCKDB_EXTENSION_CONFIGS=${{ github.workspace }}/extension_config.cmake
          -DUNITTEST_ROOT_DIRECTORY=${{ github.workspace }}
          -DENABLE_UNITTEST_CPP_TESTS=OFF -DBUILD_SHELL=OFF -DGATEKEEPER_NATIVE_PROBES=ON
      - run: cmake --build build/candidate --target unittest gatekeeper_loadable_extension gatekeeper_prepared_probe gatekeeper_qualified_probe gatekeeper_remote_probe --parallel 4
      - name: SQL contract on the candidate engine
        run: build/candidate/test/unittest 'test/sql/*'
      - name: A prepared handle held across a policy change is decided at each execution
        # Client-API behavior sqllogictest cannot express; the same expectations on both engines.
        run: build/candidate/extension/gatekeeper/gatekeeper_prepared_probe
      - name: Qualified function callback counters
        run: build/candidate/extension/gatekeeper/gatekeeper_qualified_probe
      - name: Local enforcement refuses CONNECT before remote dispatch; probe unsupported state transitions
        run: build/candidate/extension/gatekeeper/gatekeeper_remote_probe
      - name: Loadable artifact loads into the candidate engine, and its engine guard refuses another
        # The static unittest link above cannot prove the distributable artifact is usable, and a shell with
        # Gatekeeper linked in answers LOAD of the file with "already loaded" without opening it. The probe
        # loads the file into the unittest runner, which loads no linked extension on its own: an intact copy
        # must load and validate, a copy stamped for another engine must be refused by the guard even with
        # DuckDB's footer check disabled. A build that lost the guard fails here, not at a customer's.
        run: python scripts/check_engine_guard.py --extension build/candidate/extension/gatekeeper/gatekeeper.duckdb_extension --unittest build/candidate/test/unittest
      - name: Stamped engine identity matches the candidate checkout
        # Independent of the co-built runner, which would carry the same label if the build were mislabeled.
        run: python scripts/check_engine_stamp.py --extension build/candidate/extension/gatekeeper/gatekeeper.duckdb_extension --engine-source build/candidate-source

  community-makefile:
    # The path duckdb/community-extensions actually runs: `make release` with the candidate engine checked
    # out inside duckdb/ and no OVERRIDE_GIT_DESCRIBE in the environment. The Makefile must let the
    # checkout describe itself rather than labeling the rebuild as the pinned release. The 2.0 legs are the
    # community repository's `repo.ref` builds: they replace our pinned 1.5 extension-ci-tools with the 2.0
    # tools it checks out over that directory, and the prerelease leg is labeled as the version deployed for.
    name: Community make release against ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: DuckDB 1.5 candidate (a3cd0de)
            key: a3cd0de
            ref: a3cd0deed18489bafdbdadb02f4e8b36c5e8a653
            engine_major: '1'
          - name: DuckDB 2.0 alpha44357 (db0ecec)
            key: db0ecec
            ref: db0ecec124f697710036513a29e9f93a0f8577d0
            label: v2.0.0-alpha44357
            ci_tools: 969bc76276acec1c0a3922ff500d2ec3a1a3b037 # v2.0-cyanoptera
            nested_schemas: '1'
            engine_major: '2'
          - name: DuckDB 2.0 candidate (45dc0a0)
            key: 45dc0a0
            ref: 45dc0a0958c37d4f491604a76e4dd472b404d1de
            ci_tools: 969bc76276acec1c0a3922ff500d2ec3a1a3b037 # v2.0-cyanoptera
            nested_schemas: '1'
            engine_major: '2'
    env:
      CANDIDATE_ENGINE: ${{ matrix.ref }}
      CANDIDATE_CI_TOOLS: ${{ matrix.ci_tools }}
      CANDIDATE_LABEL: ${{ matrix.label }}
      GATEKEEPER_TEST_NESTED_SCHEMAS: ${{ matrix.nested_schemas || '0' }}
      GATEKEEPER_TEST_ENGINE_MAJOR: ${{ matrix.engine_major }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Check out the candidate engine inside the submodule directory
        # The submodule checkout is shallow; `git describe` (1.5) and `git rev-list --count` (2.0) need the
        # history back to the last tag, exactly as the community pipeline's full-depth checkout provides it.
        run: |
          for attempt in 1 2 3; do
            if [ "$(git -C duckdb rev-parse --is-shallow-repository)" = true ]; then
              git -C duckdb -c fetch.parallel=1 fetch --no-recurse-submodules --unshallow --tags origin && break
            else
              git -C duckdb fetch --no-recurse-submodules --tags origin && break
            fi
            sleep 5
          done
          test "$(git -C duckdb rev-parse --is-shallow-repository)" = false
          git -C duckdb fetch --no-recurse-submodules origin "$CANDIDATE_ENGINE"
          git -C duckdb checkout --quiet "$CANDIDATE_ENGINE"
          git -C duckdb describe --tags --long
      - name: Check out the community repository's extension-ci-tools for this engine
        if: matrix.ci_tools
        run: |
          git -C extension-ci-tools fetch --no-recurse-submodules origin "$CANDIDATE_CI_TOOLS"
          git -C extension-ci-tools checkout --quiet "$CANDIDATE_CI_TOOLS"
          git -C extension-ci-tools log -1 --oneline
      - uses: ./.github/actions/setup
        with:
          ccache-key: community-makefile-${{ matrix.key }}-ubuntu
          ccache-max-size: 1G
      - name: Show the engine label the Makefile passes to CMake
        run: |
          label=$(make -n release | grep -o 'OVERRIDE_GIT_DESCRIBE="[^"]*"' | head -1)
          echo "$label"
          test "$label" = 'OVERRIDE_GIT_DESCRIBE=""' || { echo "::error::Makefile forced an engine label for a non-pinned checkout"; exit 1; }
      - run: make release
        env:
          GEN: ninja
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          # The community pipeline exports the engine version it builds for as DUCKDB_VERSION, which a 2.0
          # engine adopts as its label; empty, the checkout labels itself.
          DUCKDB_VERSION: ${{ matrix.label }}
      - run: make test_release
      - name: Stamped engine identity matches the candidate checkout
        run: python scripts/check_engine_stamp.py --extension build/release/extension/gatekeeper/gatekeeper.duckdb_extension --engine-source duckdb ${CANDIDATE_LABEL:+--expect-version "$CANDIDATE_LABEL"}
      - name: Loadable artifact loads into the candidate engine, and its engine guard refuses another
        run: python scripts/check_engine_guard.py --extension build/release/extension/gatekeeper/gatekeeper.duckdb_extension --unittest build/release/test/unittest
